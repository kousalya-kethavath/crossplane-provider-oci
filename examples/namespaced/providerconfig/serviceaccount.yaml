apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-b
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oci-access
  namespace: tenant-a
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oci-access
  namespace: tenant-b
---
apiVersion: oci.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: tenant-oci
  namespace: tenant-a
spec:
  region: us-ashburn-1
  credentials:
    source: ServiceAccount
    serviceAccountRef:
      name: oci-access
---
apiVersion: oci.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: tenant-oci
  namespace: tenant-b
spec:
  region: us-ashburn-1
  credentials:
    source: ServiceAccount
    serviceAccountRef:
      name: oci-access
