apiVersion: monitoring.oci.upbound.io/v1alpha1
kind: AlarmSuppression
metadata:
  labels:
    testing.upbound.io/example-name: alarmsuppression_label_1
  name: alarmsuppression1
spec:
  forProvider:
    alarmSuppressionTarget:
    - alarmIdSelector:
          matchLabels:
            testing.upbound.io/example-name: alarm_label_1
      targetType: ALARM
    # Suppression timestamps are generated immediately before live validation.
    timeSuppressFrom: "${TIME_SUPPRESS_FROM}"
    timeSuppressUntil: "${TIME_SUPPRESS_UNTIL}"
    displayName: alarmsuppression1
    dimensions: {'availabilityDomain': 'phx-ad-1'}
